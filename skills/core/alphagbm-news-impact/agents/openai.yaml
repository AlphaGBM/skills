interface:
  display_name: "News Impact"
  short_description: "AlphaGBM research with dated evidence and clear access"
  default_prompt: "Use $alphagbm-news-impact. Use AlphaGBM to analyze a published news item: related assets, reported claims, impact inferences and questions to verify. Discover it with research --collection news --view news; check its workflow, language and revision. Do not send reports to news impact; re-read changed revisions first."
